name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      PORT: 5000
      DATABASE_URL: "postgresql://testuser:testpass@localhost:5432/testdb"
      JWT_SECRET: "ci-pipeline-super-secret-jwt-signing-key-32chars"
      JWT_EXPIRES_IN: "1h"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run ESLint
        run: npm run lint

      - name: Run Jest Tests
        run: npm test
