name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Typecheck Next.js (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Typecheck & Compile Backend Server (build:server)
        run: npm run build:server

      - name: Run ESLint
        run: npm run lint

  test:
    name: Integration & Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: curalink_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/curalink_test?schema=public"
      JWT_SECRET: "ci_jwt_secret_test_key_minimum_32_characters_long"
      REFRESH_TOKEN_SECRET: "ci_refresh_secret_test_key_minimum_32_characters_long"
      CSRF_SECRET: "ci_csrf_secret_test_key_minimum_32_characters_long"
      NODE_ENV: "test"
      PORT: "5000"
      RESEND_API_KEY: "re_mock_test_key_ci"
      RESEND_FROM_EMAIL: "notifications@curalink.health"
      APP_URL: "http://localhost:3000"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Push Schema to Test Database
        run: npx prisma db push --skip-generate

      - name: Run Jest Test Suite
        run: npm test

  build:
    name: Production Build (Next.js)
    needs: [lint-and-typecheck, test]
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
      NEXT_TELEMETRY_DISABLED: 1
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Next.js Web App
        run: npm run build
